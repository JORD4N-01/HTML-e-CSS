<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: darkred;
        }

        a:hover {
            color: black;
            text-decoration: underline;
        }

        a:active {
            color: yellow;
        }

        .especial {
            background-color: rgb(255, 159, 159);
            width: 200px;

        }

        .especial::after {
            content: "[link]";
            text-decoration:none;
            font-weight: bold;
            color: darkgray;
        }

        .especial::before {
            content: "->";
        }
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://gustavoguanabra.github.io" target="_blank">Repo Github</a></li>
        <li class="especial"><a href="https://youtube.com/cursoemvideo">Canal do youtube</a></li>
        <li class="especial "><a href="https://www.cursoemvideo.com">site do Curso em video</a></li>
    </ul>
</body>
</html>
