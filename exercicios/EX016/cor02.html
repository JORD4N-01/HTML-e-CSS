<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>

        * { /* Configuração global*/
            height: 100%;
        }

        body {
            background-image: linear-gradient(-45deg, #FE077D, #FC01D8,#AC08F0, #FFC700, #FE8903);
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h1>testando gradiente</h1>
</body>
</html>
