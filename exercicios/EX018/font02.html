<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>

        @font-face {
            font-family: "varsity";
            src: url("fonts/varsity_regular.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-family: 'varsity', Times, serif;
            font-size: 3em;
        }
    </style>
</head>
<body>
    <h1>TITULO</h1>
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Excepturi necessitatibus, animi nemo obcaecati temporibus, quisquam adipisci dolor fuga sint magnam exercitationem blanditiis illum doloremque et nisi voluptates labore suscipit atque.</p>
</body>
</html>
