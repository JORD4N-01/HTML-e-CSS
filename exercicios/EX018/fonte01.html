<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texto com google fonts</title>
    <style>

        @import url('https://fonts.googleapis.com/css2?family=Imperial+Script&display=swap');

        body {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            background-image: linear-gradient(to bottom, red, pink);
            background-attachment: fixed;
        }

        h1 {
            font-family: "Imperial Script" ;
            font-size: 5em;
            background-color: aqua;
        }

        h2 {
          font-family: "Imperial Script" ;
          font-size: 2em;  
        }
    </style>
</head>
<body>
    <h1>Titulo</h1>
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Minima voluptates rerum culpa numquam earum officia id delectus rem eos neque, expedita soluta. Nulla dolores sunt, veritatis itaque quis fuga quia!</p>

    <h2>Subtitulo</h2>
</body>
</html>
