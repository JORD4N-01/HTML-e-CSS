<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragráfos</title>
</head>
<body>
    <h1>Parágrafos e quebras de linhas</h1>
    <hr>
    <p>Você pode escever um paragráfo de qualquer jeito basta colocar no meio do par de tags &lt;p&gt; e &lt;/p&gt; </p> <!--LESS THAN / GREATER THAN-->
    <p>Se precisar quebrar o texto <br> em algum lugar use a tag br.</p>

    <p>vamos adicionar sibolos especiais:
        &reg;
        &copy;
        &trade;
        &euro;
        &pound;
        &yen;
        &cent;
        &Delta;
        &uparrow;
    </p>

    <p>vamos adicionar alguns emojis:
        você e muito linda &#x1F92B; &#x1F496;
    </p>
</body>
