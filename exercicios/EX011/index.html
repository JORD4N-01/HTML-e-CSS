<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML 5</title>
</head>
<body>
    <h1>Imagens dinâmicas</h1>
    <p>abra em dispositivos diferentes</p>

    <picture>
        <source media="(max-width: 750px )" srcset="img/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="img/foto-m.png" type="image/png">
        <img src="img/foto-g.png" alt="imagem flexivel">
    </picture>

    <h1>Reproduzindo audio</h1>
    <p>Apredendo a colocar audio no site</p>
    <audio preload="metadata" controls loop>
        <source src="midia/guanacast-33.mp3" type="audio/mp3">
        <p>Infelizmente seu navegador não consegue reproduzir este tipo de audio <a href="midia/guanacast-33.mp3"> clique aqui para baixar o arquivo MP3</a></p>
    </audio>
</body>
</html>
